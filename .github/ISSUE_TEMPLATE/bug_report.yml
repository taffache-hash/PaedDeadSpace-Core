name: Bug report
description: Report a reproducible software problem
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: Describe what happened.}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction steps, description: Provide a minimal reproducible example.}
    validations: {required: true}
  - type: input
    id: environment
    attributes: {label: Environment, description: OS and Python version}
    validations: {required: true}
